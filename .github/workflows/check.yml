name: check
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Kernel tests
        run: python -m unittest tests.test_kernel
      - name: Example
        run: python -m feasfront examples/sites.csv --max-slope 15 --min-sun 100 --min-earth 10 --max-night 100 || test $? -eq 1
      - name: Geometry
        run: python -m feasfront examples/geometry.csv --max-slope 15 --min-sun 1 --min-earth 1 --max-night 24 --duration 24
