[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "feasfront"
version = "0.1.0"
description = "Flat-horizon sun, Earth, and night hours, then the slope limit you set."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Digital Currensy Inc."}]
[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
feasfront = "feasfront.__main__:main"
